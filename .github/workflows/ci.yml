# Build and test on every push and pull request to main.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build
        run: make
      - name: test
        run: make test
      - name: stress
        run: make test-stress

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: GNU timeout for the tests
        run: brew install coreutils && echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: build
        run: make
      - name: test
        run: make test

  # Every release target builds on every change, and the Linux ones run the
  # smoke test under qemu-user, so a tag never finds a broken target first.
  cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: zig and qemu
        run: tools/ci-setup.sh zig qemu
      - name: build every zig target
        run: |
          for t in $(tools/dist.sh --list); do
            case $t in *-freedos) continue ;; esac
            tools/dist.sh "$t"
          done
      - name: smoke test the Linux targets
        run: |
          v=$(sed -n 's/^#define LC_VERSION "\(.*\)"$/\1/p' include/charts.h)
          for t in x86_64-linux-musl aarch64-linux-musl armv7-linux-musleabihf i686-linux-musl riscv64-linux-musl; do
            mkdir -p "x/$t" && tar -xzf "dist/charts-$v-$t.tar.gz" -C "x/$t"
            echo "== $t"
            tests/smoke.sh "x/$t/charts-$v-$t/charts" > "x/$t.log" 2>&1 || { grep -E 'FAIL|passed' "x/$t.log"; exit 1; }
            tail -1 "x/$t.log"
          done
