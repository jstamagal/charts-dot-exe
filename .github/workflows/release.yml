# A pushed tag vX.Y.Z (tools/release.sh makes one) builds every target, tests
# each archive's program where it runs, and publishes the GitHub Release with
# all archives and SHA256SUMS. The notes are the tag's message.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the tag is the version, and the version is below 1.0
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(sed -n 's/^#define LC_VERSION "\(.*\)"$/\1/p' include/charts.h)
          [ "$TAG" = "v$v" ] || { echo "tag $TAG, but include/charts.h says $v"; exit 1; }
          echo "$v" | grep -Eq '^0\.[0-9]+\.[0-9]+$' || { echo "$v is not below 1.0"; exit 1; }
          grep -q "charts $v\\\\n" app/cli.c || { echo "app/cli.c does not print $v"; exit 1; }
      - name: build and test
        run: make && make test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux-musl,      os: ubuntu-24.04, test: smoke }
          - { target: aarch64-linux-musl,     os: ubuntu-24.04, test: smoke }
          - { target: armv7-linux-musleabihf, os: ubuntu-24.04, test: smoke }
          - { target: i686-linux-musl,        os: ubuntu-24.04, test: smoke }
          - { target: riscv64-linux-musl,     os: ubuntu-24.04, test: smoke }
          - { target: x86_64-freebsd,         os: ubuntu-24.04, test: vm }
          - { target: aarch64-macos,          os: macos-15, cc: clang -arch arm64,  test: smoke }
          - { target: x86_64-macos,           os: macos-15, cc: clang -arch x86_64, test: smoke }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tools
        if: runner.os == 'Linux'
        run: tools/ci-setup.sh zig qemu
      - name: build ${{ matrix.target }}
        env:
          CC: ${{ matrix.cc }}
        run: tools/dist.sh "${{ matrix.target }}"
      - name: smoke test the packed program
        if: matrix.test == 'smoke'
        run: |
          mkdir x && tar -xzf dist/charts-*.tar.gz -C x
          bin=$(echo x/charts-*/charts)
          file "$bin"
          "$bin" --version
          tests/smoke.sh "$bin"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  freebsd:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-freebsd
          path: dist
      - name: smoke test in FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          usesh: true
          prepare: pkg install -y bash python3
          run: |
            set -e
            mkdir x && tar -xzf dist/charts-*.tar.gz -C x
            bin=$(echo x/charts-*/charts)
            file "$bin"
            "$bin" --version
            bash tests/smoke.sh "$bin"

  publish:
    needs: [build, freebsd]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum charts-* > SHA256SUMS
          cat SHA256SUMS
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # checkout can leave a lightweight copy of the tag; fetch the annotated one.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" | sed -e '/^-----BEGIN PGP/,$d' \
            -e '/^Co-Authored-By: /d' -e '/^Claude-Session: /d' -e '/^Signed-off-by: /d' > notes.md
          {
            echo
            echo "Archives: one per target, the program with README.md, LICENSE, the man page and"
            echo "the agent skill. SHA256SUMS holds their digests (sha256sum -c SHA256SUMS)."
          } >> notes.md
          gh release create "$TAG" dist/* --verify-tag --title "charts ${TAG#v}" --notes-file notes.md
